<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Australia Superannuation Calculator 2025 | Tabutility</title>
  <meta name="description" content="Calculate Australian superannuation contributions, employer SG contributions and projected super balance at retirement. 2025 SG rate 11.5%." />
  <meta name="keywords" content="australia superannuation calculator, super calculator, super guarantee 2025, super balance projection, concessional contributions" />
  <link rel="canonical" href="https://australia-super.tabutility.com/" />
  <meta property="og:title" content="Australia Superannuation Calculator 2025" />
  <meta property="og:description" content="Calculate super contributions, tax and projected balance at retirement for 2025." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇦🇺</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n){return 'A$'+Math.round(n).toLocaleString();}

function App() {
  const [salary, setSalary] = useState(90000);
  const [age, setAge] = useState(35);
  const [retireAge, setRetireAge] = useState(67);
  const [currentSuper, setCurrent] = useState(40000);
  const [voluntaryPct, setVoluntary] = useState(0);
  const [returnRate, setReturn] = useState(7.5);

  // 2025-26: SG rate = 11.5%, rising to 12% from 1 Jul 2025
  const SG_RATE = 0.115;
  const CONCESSIONAL_CAP = 30000;
  const NON_CONCESSIONAL_CAP = 110000;

  const s = Number(salary)||0;
  const employerContrib = s * SG_RATE;
  const voluntaryContrib = s * (Number(voluntaryPct)||0) / 100;
  const totalConcessional = Math.min(employerContrib + voluntaryContrib, CONCESSIONAL_CAP);
  const superTax = totalConcessional * 0.15; // contributions tax 15%

  const years = Math.max(0, Number(retireAge) - Number(age));
  const annualContrib = employerContrib + voluntaryContrib;
  const r = Number(returnRate)||7.5;
  const pv = Number(currentSuper)||0;
  const fv = pv * Math.pow(1+r/100, years) + annualContrib * (Math.pow(1+r/100,years)-1)/(r/100);

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#d97706,#b45309)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🇦🇺</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Superannuation Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>SG 11.5% (2024-25) · concessional caps · balance at retirement</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          {[
            ['Annual Salary (before super)','A$',salary,setSalary],
            ['Current Super Balance','A$',currentSuper,setCurrent],
          ].map(([l,p,v,s])=>(
            <div key={l} style={{marginBottom:14}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>{l}</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>{p}</span>
                <input type="number" value={v} onChange={e=>s(e.target.value)}
                  style={{width:'100%',padding:'11px 12px 11px 36px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          ))}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
            {[['Current Age','yrs',age,setAge],['Retirement Age','yrs',retireAge,setRetireAge]].map(([l,p,v,s])=>(
              <div key={l}>
                <label style={{fontSize:12,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>{l}</label>
                <input type="number" value={v} onChange={e=>s(e.target.value)}
                  style={{width:'100%',padding:'9px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:14,boxSizing:'border-box'}} />
              </div>
            ))}
          </div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Voluntary Salary Sacrifice: <span style={{color:'#d97706'}}>{voluntaryPct}%</span></label>
            <input type="range" min={0} max={30} step={0.5} value={voluntaryPct} onChange={e=>setVoluntary(e.target.value)} style={{width:'100%',accentColor:'#d97706'}} />
          </div>
          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Investment Return: <span style={{color:'#d97706'}}>{returnRate}%</span></label>
            <input type="range" min={2} max={15} step={0.5} value={returnRate} onChange={e=>setReturn(e.target.value)} style={{width:'100%',accentColor:'#d97706'}} />
          </div>
        </div>

        <div style={{background:'linear-gradient(135deg,#fef3c7,#fde68a)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#78350f'}}>SUPER AT RETIREMENT (age {retireAge})</div>
          <div style={{fontSize:44,fontWeight:900,color:'#b45309',margin:'6px 0'}}>{fmt(fv)}</div>
          <div style={{fontSize:13,color:'#92400e'}}>Over {years} years · {fmt(annualContrib)}/yr total contributions</div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Annual Salary', fmt(s)],
            ['Employer SG (11.5%)', fmt(employerContrib)],
            ...(voluntaryContrib>0?[['Voluntary (salary sacrifice)', fmt(voluntaryContrib)]]:[]),
            ['Total Annual Contributions', fmt(annualContrib)],
            ['Concessional Cap 2024-25', fmt(CONCESSIONAL_CAP)],
            ['Contributions Tax (15%)', fmt(superTax)],
            ['Years to Retirement', years.toString()],
            ['Projected Balance', fmt(fv)],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong style={{color:l.includes('Projected')?'#b45309':'#1a1a2e'}}>{v}</strong>
            </div>
          ))}
        </div>
        <div style={{background:'#fef3c7',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#78350f',lineHeight:1.6}}>
          <strong>2024-25:</strong> SG rate 11.5%, rising to 12% from 1 July 2025. Concessional cap A$30,000/yr (employer + salary sacrifice). Non-concessional cap A$110,000/yr. Contributions taxed at 15% inside super. Withdrawals tax-free after age 60.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
